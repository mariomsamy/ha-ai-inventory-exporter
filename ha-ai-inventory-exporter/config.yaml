name: "AI Inventory Exporter"
description: "Exports a full Home Assistant inventory JSON for AI-assisted automations and dashboards."
version: "1.0.4"
slug: "ai_inventory_exporter"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: services
boot: auto
homeassistant_api: true
hassio_api: false
ingress: true
ingress_port: 8099
panel_icon: mdi:robot
panel_title: AI Inventory
map:
  - type: homeassistant_config
    read_only: false
    path: /config
options:
  output_path: "/config/www/ai/home_assistant_full_inventory.json"
  interval_minutes: 60
  run_once: false
schema:
  output_path: "str"
  interval_minutes: "int(5,1440)"
  run_once: "bool"
